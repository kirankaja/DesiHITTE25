name: DesiHITTE25
options:
  bundleIdPrefix: com.desihitte25
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  DesiHITTE25:
    type: application
    platform: iOS
    sources:
      - DesiHITTE25
    settings:
      base:
        INFOPLIST_FILE: DesiHITTE25/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.desihitte25.kirankaja
        DEVELOPMENT_TEAM: "7HE2392X5K"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: AVFoundation.framework
      - sdk: WebKit.framework
      - sdk: SwiftData.framework
      - sdk: HealthKit.framework
